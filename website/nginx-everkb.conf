# EverKB 备案展示页 nginx 配置
# 存放位置: /etc/nginx/conf.d/everkb.conf
# 配好后执行: nginx -t && nginx -s reload

server {
    listen 80;
    server_name www.everkb.cn everkb.cn;

    root /var/www/everkb/website;
    index index.html;

    # 静态文件缓存
    location ~* \.(html|css|js|png|jpg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # 访问日志
    access_log /var/log/nginx/everkb.access.log;
    error_log  /var/log/nginx/everkb.error.log;
}
